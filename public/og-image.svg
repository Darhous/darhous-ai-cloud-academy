<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c0e12"/>
      <stop offset="50%" style="stop-color:#111318"/>
      <stop offset="100%" style="stop-color:#0c0e12"/>
    </linearGradient>
    <radialGradient id="orb1" cx="20%" cy="30%" r="40%">
      <stop offset="0%" style="stop-color:rgba(56,189,248,0.18)"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </radialGradient>
    <radialGradient id="orb2" cx="80%" cy="70%" r="40%">
      <stop offset="0%" style="stop-color:rgba(87,27,193,0.2)"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </radialGradient>
    <radialGradient id="orb3" cx="50%" cy="50%" r="30%">
      <stop offset="0%" style="stop-color:rgba(60,224,251,0.08)"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8ed5ff"/>
      <stop offset="50%" style="stop-color:#3ce0fb"/>
      <stop offset="100%" style="stop-color:#d0bcff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Ambient orbs -->
  <ellipse cx="240" cy="189" rx="480" ry="252" fill="url(#orb1)"/>
  <ellipse cx="960" cy="441" rx="480" ry="252" fill="url(#orb2)"/>
  <ellipse cx="600" cy="315" rx="360" ry="189" fill="url(#orb3)"/>

  <!-- Grid overlay lines (subtle) -->
  <g opacity="0.03" stroke="#8ed5ff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Border frame -->
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="none" stroke="rgba(142,213,255,0.12)" stroke-width="1.5"/>

  <!-- Bot icon circle -->
  <circle cx="600" cy="130" r="44" fill="rgba(56,189,248,0.1)" stroke="rgba(56,189,248,0.25)" stroke-width="1.5"/>
  <text x="600" y="145" text-anchor="middle" font-size="42">🤖</text>

  <!-- Main title EN -->
  <text x="600" y="240" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="700" fill="url(#textGrad)">Darhous AI Cloud Academy</text>

  <!-- Main title AR -->
  <text x="600" y="300" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="600" fill="rgba(232,234,240,0.9)">أكاديمية درهوس للذكاء الاصطناعي والكلاود</text>

  <!-- Divider -->
  <line x1="350" y1="330" x2="850" y2="330" stroke="rgba(142,213,255,0.15)" stroke-width="1"/>

  <!-- Subtitle pills -->
  <rect x="160" y="355" width="170" height="38" rx="19" fill="rgba(56,189,248,0.08)" stroke="rgba(56,189,248,0.25)" stroke-width="1"/>
  <text x="245" y="379" text-anchor="middle" font-family="monospace, sans-serif" font-size="15" fill="#8ed5ff">AI · Claude</text>

  <rect x="350" y="355" width="170" height="38" rx="19" fill="rgba(208,188,255,0.08)" stroke="rgba(208,188,255,0.25)" stroke-width="1"/>
  <text x="435" y="379" text-anchor="middle" font-family="monospace, sans-serif" font-size="15" fill="#d0bcff">Cloud · DevOps</text>

  <rect x="540" y="355" width="220" height="38" rx="19" fill="rgba(60,224,251,0.08)" stroke="rgba(60,224,251,0.25)" stroke-width="1"/>
  <text x="650" y="379" text-anchor="middle" font-family="monospace, sans-serif" font-size="15" fill="#3ce0fb">Prompt Engineering</text>

  <rect x="780" y="355" width="170" height="38" rx="19" fill="rgba(74,222,128,0.08)" stroke="rgba(74,222,128,0.25)" stroke-width="1"/>
  <text x="865" y="379" text-anchor="middle" font-family="monospace, sans-serif" font-size="15" fill="#86efac">Real Projects</text>

  <!-- Domain -->
  <text x="600" y="470" text-anchor="middle" font-family="monospace, sans-serif" font-size="20" fill="rgba(154,163,184,0.6)">darhous-ai-cloud-academy.vercel.app</text>

  <!-- Stats row -->
  <text x="280" y="530" text-anchor="middle" font-family="monospace, sans-serif" font-size="13" fill="rgba(142,213,255,0.5)">✦ 18 Courses</text>
  <text x="440" y="530" text-anchor="middle" font-family="monospace, sans-serif" font-size="13" fill="rgba(208,188,255,0.5)">✦ 52+ AI Tools</text>
  <text x="600" y="530" text-anchor="middle" font-family="monospace, sans-serif" font-size="13" fill="rgba(60,224,251,0.5)">✦ 5 AI Studio Tools</text>
  <text x="760" y="530" text-anchor="middle" font-family="monospace, sans-serif" font-size="13" fill="rgba(74,222,128,0.5)">✦ 14 Projects</text>
  <text x="920" y="530" text-anchor="middle" font-family="monospace, sans-serif" font-size="13" fill="rgba(251,191,36,0.5)">✦ Arabic · English</text>
